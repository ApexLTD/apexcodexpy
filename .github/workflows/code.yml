name: Check Python Code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - &checkout
        uses: actions/checkout@v6

      - &setup-python
        name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
          pip-install: apexcodexpy

      - &setup-dependencies
        name: Install dependencies
        run: codex install

      - name: Lint
        run: codex lint --ci

  test-unit:
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-python
      - *setup-dependencies

      - name: Test unit
        run: codex test unit --ci

  test-integration:
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-python
      - *setup-dependencies

      - name: Test integration
        run: codex test integration --ci

  test-behaviour:
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-python
      - *setup-dependencies

      - name: Test behaviour
        run: codex test behaviour
