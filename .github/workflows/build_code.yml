name: Build Python Application

on:
  push:
    branches:
      - main

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          pip-install: apexcodexpy
      - name: Build Docker image
        run: codex build --tag ${{ github.event.repository.name }}:latest
      - name: Push Docker image
        run: codex push --tag ${{ github.event.repository.name }}:latest --organization ${{ github.repository_owner }} --token ${{ secrets.GITHUB_TOKEN }} --actor ${{ github.actor }}

  deploy:
    runs-on:
      - self-hosted
      - company
    needs: build
    steps:
      - uses: actions/checkout@v7
