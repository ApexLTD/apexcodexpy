[project]
name = "apexcodexpy"
version = "0.5.2"
description = "The Non-Destructive Configuration Steward for Python Projects."
readme = "README.md"
authors = [
    { name = "Apex Dev", email = "dev@apex.ge" }
]
dynamic = ["dependencies"]
requires-python = ">=3.11,<4"

[project.scripts]
codex = "codex.runner:cli"

[tool.poetry]
packages = [
    { include = "codex" }
]

[tool.poetry.dependencies]
typer = "*"
tomlkit = "*"
mypy = "*"
ruff = "*"
pyyaml = "*"
deptry = "*"

[tool.poetry.group.dev.dependencies]
behave = "*"
coverage = "*"
pytest = "*"
pytest-cov = "*"

[tool.poetry.group.lint.dependencies]
types-pyyaml = "*"

[tool.mypy]
ignore_missing_imports = true
strict = true
show_error_codes = true
pretty = true

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "PT",
    "RSE",
    "RET",
    "SIM",
    "T20",
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.deptry.per_rule_ignores]
DEP002 = [
    "mypy",
    "ruff",
    "deptry",
]

[tool.coverage.run]
branch = true
source = [
    "codex",
    "tests",
]

[tool.coverage.report]
skip_empty = true
skip_covered = true
show_missing = true

[tool.pytest]
testpaths = [
    "tests/unit",
]
