[project]
name = "apexcodexpy"
version = "0.8.2"
description = "The Non-Destructive Configuration Steward for Python Projects."
readme = "README.md"
authors = [
    { name = "Apex Dev", email = "dev@apex.ge" },
]
requires-python = ">=3.11,<4"
dynamic = [ "dependencies" ]

[project.scripts]
codex = "codex.runner:cli"

[tool.poetry]
packages = [
    { include = "codex" },
]

[tool.poetry.dependencies]
deptry = "*"
mypy = "*"
pyproject-fmt = "*"
ruamel-yaml = "*"
ruff = "*"
tomlkit = "*"
typer = "*"

[tool.poetry.group.dev.dependencies]
behave = "*"
coverage = "*"
pytest = "*"
pytest-cov = "*"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "FBT",
    "FLY",
    "FURB",
    "I",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLF",
    "T20",
    "TCH",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "TRY003",
]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "mypy",
    "ruff",
    "deptry",
    "pyproject-fmt",
]

[tool.mypy]
ignore_missing_imports = true
strict = true
pretty = true
show_error_codes = true

[tool.pytest]
testpaths = [
    "tests/unit",
]

[tool.coverage.run]
source = [
    "codex",
    "tests",
]
branch = true

[tool.coverage.report]
skip_covered = true
skip_empty = true
show_missing = true
